<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" style="max-width:1200px">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#21262d"/>
  </pattern>
  <rect width="1200" height="600" fill="url(#dots)" opacity="0.4"/>

  <!-- Title -->
  <text x="600" y="72" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#f0f6fc" text-anchor="middle">
    🛡️ ddos-monitoring
  </text>
  <text x="600" y="115" font-family="-apple-system,sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">
    Real-time DDoS detection for VPN node fleets
  </text>

  <!-- Accent line -->
  <rect x="420" y="132" width="360" height="3" rx="1.5" fill="url(#58a6ff)" opacity="0.5"/>
  <rect x="420" y="132" width="360" height="3" rx="1.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- === ARCHITECTURE === -->

  <!-- Agent box -->
  <rect x="80" y="190" width="220" height="130" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <rect x="80" y="190" width="220" height="40" rx="12" fill="#161b22"/>
  <rect x="80" y="218" width="220" height="12" fill="#161b22"/>
  <text x="190" y="218" font-family="SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700" fill="#58a6ff" text-anchor="middle">🖥 AGENT</text>
  <text x="190" y="252" font-family="-apple-system,sans-serif" font-size="16" fill="#c9d1d9" text-anchor="middle">rx_bps · pps · syn</text>
  <text x="190" y="278" font-family="-apple-system,sans-serif" font-size="16" fill="#c9d1d9" text-anchor="middle">cpu · ram · conntrack</text>
  <text x="190" y="308" font-family="SFMono-Regular,monospace" font-size="14" fill="#484f58" text-anchor="middle">каждые 20 сек</text>

  <!-- Arrow agent → poller -->
  <line x1="300" y1="255" x2="410" y2="255" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="320" y="235" width="70" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="355" y="252" font-family="SFMono-Regular,monospace" font-size="14" fill="#58a6ff" text-anchor="middle">ws</text>

  <!-- Poller box -->
  <rect x="420" y="180" width="280" height="170" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <rect x="420" y="180" width="280" height="40" rx="12" fill="#161b22"/>
  <rect x="420" y="208" width="280" height="12" fill="#161b22"/>
  <text x="560" y="208" font-family="SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700" fill="#3fb950" text-anchor="middle">⚙️ POLLER</text>

  <!-- Threshold check -->
  <rect x="450" y="235" width="220" height="35" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="560" y="258" font-family="SFMono-Regular,monospace" font-size="17" fill="#f0f6fc" text-anchor="middle">metric &gt; threshold?</text>

  <!-- Attack result -->
  <rect x="450" y="285" width="100" height="35" rx="6" fill="#1c0a0a" stroke="#f85149" stroke-width="2"/>
  <text x="500" y="308" font-family="SFMono-Regular,monospace" font-size="17" font-weight="700" fill="#f85149" text-anchor="middle">ATTACK</text>

  <!-- OK result -->
  <rect x="570" y="285" width="100" height="35" rx="6" fill="#0a1c0a" stroke="#3fb950" stroke-width="2"/>
  <text x="620" y="308" font-family="SFMono-Regular,monospace" font-size="17" font-weight="700" fill="#3fb950" text-anchor="middle">OK</text>

  <!-- Arrow poller → Telegram -->
  <line x1="700" y1="240" x2="810" y2="220" stroke="#f0883e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Arrow poller → Dashboard -->
  <line x1="700" y1="280" x2="810" y2="300" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Telegram box -->
  <rect x="820" y="190" width="260" height="60" rx="12" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="950" y="220" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#f0883e" text-anchor="middle">📱 Telegram</text>
  <text x="950" y="242" font-family="SFMono-Regular,monospace" font-size="14" fill="#8b949e" text-anchor="middle">🔴 атака · 🟢 завершена</text>

  <!-- Dashboard box -->
  <rect x="820" y="270" width="260" height="60" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="950" y="300" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#58a6ff" text-anchor="middle">📊 Dashboard</text>
  <text x="950" y="322" font-family="SFMono-Regular,monospace" font-size="14" fill="#8b949e" text-anchor="middle">KPI · sparkline · table</text>

  <!-- === BOTTOM ROW === -->

  <!-- Severity -->
  <rect x="80" y="380" width="340" height="120" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="110" y="415" font-family="-apple-system,sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">SEVERITY</text>
  <circle cx="120" cy="445" r="8" fill="#f85149"/>
  <text x="140" y="451" font-family="SFMono-Regular,monospace" font-size="17" font-weight="600" fill="#f0f6fc">CRITICAL</text>
  <text x="270" y="451" font-family="-apple-system,sans-serif" font-size="15" fill="#8b949e">syn &gt; 2× или rx &gt; 5×</text>
  <circle cx="120" cy="478" r="8" fill="#d29922"/>
  <text x="140" y="484" font-family="SFMono-Regular,monospace" font-size="17" font-weight="600" fill="#f0f6fc">WARNING</text>
  <text x="270" y="484" font-family="-apple-system,sans-serif" font-size="15" fill="#8b949e">выше порога</text>

  <!-- Baseline -->
  <rect x="450" y="380" width="340" height="120" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="480" y="415" font-family="-apple-system,sans-serif" font-size="20" font-weight="700" fill="#3fb950">⚡ BASELINE</text>
  <text x="480" y="448" font-family="SFMono-Regular,monospace" font-size="16" fill="#c9d1d9">p95 за 7 дней × коэф.</text>
  <text x="480" y="475" font-family="SFMono-Regular,monospace" font-size="16" fill="#c9d1d9">threshold = max(static,</text>
  <text x="480" y="498" font-family="SFMono-Regular,monospace" font-size="16" fill="#c9d1d9">  baseline, min_floor)</text>

  <!-- Badges -->
  <rect x="820" y="390" width="140" height="34" rx="17" fill="#1f6feb"/>
  <text x="890" y="413" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Plugin API v1</text>

  <rect x="820" y="435" width="140" height="34" rx="17" fill="#238636"/>
  <text x="890" y="458" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">175 Tests</text>

  <rect x="820" y="480" width="140" height="34" rx="17" fill="#30363d"/>
  <text x="890" y="503" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#8b949e" text-anchor="middle">MIT License</text>

  <!-- Shield icon watermark -->
  <g transform="translate(1020, 400)" opacity="0.08">
    <path d="M50 0 L100 25 L100 75 Q100 110 50 130 Q0 110 0 75 L0 25 Z" fill="#58a6ff"/>
  </g>

  <!-- Footer -->
  <text x="600" y="565" font-family="SFMono-Regular,monospace" font-size="14" fill="#484f58" text-anchor="middle">remnawave-admin plugin · aiosqlite · aiohttp · psutil · websockets</text>
</svg>
