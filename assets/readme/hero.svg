<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" style="max-width:1200px">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.8" fill="#21262d"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.5"/>

  <!-- Title -->
  <text x="80" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#f0f6fc">
    🛡️ ddos-monitoring
  </text>
  <text x="80" y="130" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,sans-serif" font-size="20" fill="#8b949e">
    Real-time DDoS detection for VPN node fleets
  </text>

  <!-- Accent line -->
  <rect x="80" y="148" width="200" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Architecture diagram -->
  <!-- Agent box -->
  <rect x="100" y="200" width="180" height="90" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="100" y="200" width="180" height="28" rx="8" fill="#161b22"/>
  <text x="190" y="220" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="13" fill="#58a6ff" text-anchor="middle">AGENT</text>
  <text x="190" y="248" font-family="-apple-system,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">rx_bps · pps · syn</text>
  <text x="190" y="266" font-family="-apple-system,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">cpu · ram · conntrack</text>
  <text x="190" y="284" font-family="SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="middle">every 20s</text>

  <!-- Arrow agent→poller -->
  <line x1="280" y1="245" x2="410" y2="245" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <text x="345" y="238" font-family="SFMono-Regular,monospace" font-size="10" fill="#58a6ff" text-anchor="middle">ws</text>

  <!-- Poller box -->
  <rect x="420" y="180" width="220" height="130" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="420" y="180" width="220" height="28" rx="8" fill="#161b22"/>
  <text x="530" y="200" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="13" fill="#3fb950" text-anchor="middle">POLLER</text>

  <!-- Threshold check -->
  <rect x="440" y="218" width="180" height="22" rx="4" fill="#1c2128"/>
  <text x="530" y="234" font-family="SFMono-Regular,monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">metric &gt; threshold?</text>

  <!-- Attack box -->
  <rect x="440" y="250" width="82" height="22" rx="4" fill="#1c0a0a" stroke="#f85149" stroke-width="1"/>
  <text x="481" y="265" font-family="SFMono-Regular,monospace" font-size="10" fill="#f85149" text-anchor="middle">ATTACK</text>

  <!-- OK box -->
  <rect x="538" y="250" width="82" height="22" rx="4" fill="#0a1c0a" stroke="#3fb950" stroke-width="1"/>
  <text x="579" y="265" font-family="SFMono-Regular,monospace" font-size="10" fill="#3fb950" text-anchor="middle">OK</text>

  <!-- Arrow poller→alerts -->
  <line x1="640" y1="245" x2="740" y2="210" stroke="#f0883e" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <line x1="640" y1="245" x2="740" y2="280" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Telegram box -->
  <rect x="750" y="185" width="180" height="50" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <text x="840" y="207" font-family="-apple-system,sans-serif" font-size="13" fill="#f0883e" text-anchor="middle">📱 Telegram</text>
  <text x="840" y="225" font-family="SFMono-Regular,monospace" font-size="10" fill="#8b949e" text-anchor="middle">🔴 attack · 🟢 resolved</text>

  <!-- Dashboard box -->
  <rect x="750" y="255" width="180" height="50" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="840" y="277" font-family="-apple-system,sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle">📊 Dashboard</text>
  <text x="840" y="295" font-family="SFMono-Regular,monospace" font-size="10" fill="#8b949e" text-anchor="middle">KPI · sparkline · table</text>

  <!-- SQLite -->
  <rect x="420" y="330" width="220" height="40" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="530" y="355" font-family="SFMono-Regular,monospace" font-size="12" fill="#8b949e" text-anchor="middle">SQLite (WAL) · attacks · snapshots</text>

  <!-- Severity legend -->
  <rect x="100" y="360" width="280" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="385" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">SEVERITY</text>
  <circle cx="130" cy="405" r="5" fill="#f85149"/>
  <text x="145" y="410" font-family="SFMono-Regular,monospace" font-size="12" fill="#f0f6fc">CRITICAL</text>
  <text x="240" y="410" font-family="-apple-system,sans-serif" font-size="11" fill="#8b949e">syn > 2× or rx > 5×</text>
  <circle cx="130" cy="430" r="5" fill="#d29922"/>
  <text x="145" y="435" font-family="SFMono-Regular,monospace" font-size="12" fill="#f0f6fc">WARNING</text>
  <text x="240" y="435" font-family="-apple-system,sans-serif" font-size="11" fill="#8b949e">above threshold</text>
  <circle cx="130" cy="450" r="5" fill="#58a6ff"/>
  <text x="145" y="455" font-family="SFMono-Regular,monospace" font-size="12" fill="#f0f6fc">LOW</text>
  <text x="240" y="455" font-family="-apple-system,sans-serif" font-size="11" fill="#8b949e">minor exceedance</text>

  <!-- Baseline box -->
  <rect x="420" y="395" width="280" height="100" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="440" y="420" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#3fb950">⚡ ADAPTIVE BASELINE</text>
  <text x="440" y="442" font-family="SFMono-Regular,monospace" font-size="11" fill="#8b949e">p95 × coeff (7-day window)</text>
  <text x="440" y="460" font-family="SFMono-Regular,monospace" font-size="11" fill="#8b949e">rx_bps = p95 × 3 · rx_pps = p95 × 2</text>
  <text x="440" y="478" font-family="SFMono-Regular,monospace" font-size="11" fill="#8b949e">threshold = max(static, baseline, floor)</text>

  <!-- Badges row -->
  <rect x="100" y="520" width="160" height="28" rx="14" fill="#1f6feb"/>
  <text x="180" y="539" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Plugin API v1</text>

  <rect x="280" y="520" width="160" height="28" rx="14" fill="#238636"/>
  <text x="360" y="539" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Python 3.11+</text>

  <rect x="460" y="520" width="160" height="28" rx="14" fill="#1f6feb"/>
  <text x="540" y="539" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">175 Tests</text>

  <rect x="640" y="520" width="160" height="28" rx="14" fill="#30363d"/>
  <text x="720" y="539" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">MIT License</text>

  <!-- Footer -->
  <text x="80" y="590" font-family="SFMono-Regular,monospace" font-size="11" fill="#484f58">remnawave-admin plugin · aiosqlite · aiohttp · psutil · websockets</text>

  <!-- Shield motif - small -->
  <g transform="translate(1060, 60) scale(0.6)" opacity="0.15">
    <path d="M60 10 L110 35 L110 80 Q110 120 60 140 Q10 120 10 80 L10 35 Z" fill="none" stroke="#58a6ff" stroke-width="4"/>
    <path d="M45 75 L55 85 L80 55" fill="none" stroke="#3fb950" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
